<!DOCTYPE html>
<html>
<head>

    <title>MightyPanda88 Flash</title>

    <script type="text/javascript" src="http://cache.download.banner.mightypanda88.com/integrationjs.php"></script>

    <script type="text/javascript">
        iapiSetCallout('Login', calloutLogin);
        iapiSetCallout('Logout', calloutLogout);

        var uri = "";

        function login(realMode) {
            iapiLogin(document.getElementById("loginform").username.value.toUpperCase(), document.getElementById("loginform").password.value, realMode, "en");
        }

        function logout(allSessions, realMode) {
            iapiLogout(allSessions, realMode);
        }

        function calloutLogin(response) {
            if (response.errorCode) {
                alert("Login failed, " + response.errorText);
            }
            else {
                //window.location = "http://cache.download.banner.mightypanda88.com/casinoclient.html?game=vbal&language=EN&nolobby=1";
                window.location = uri;
            }
        }

        function calloutLogout(response) {
            if (response.errorCode) {
                alert("Logout failed, " + response.errorCode);
            }
            else {
                alert("Logout OK");
            }
        }

        function getParameterByName(name, url) {
            if (!url) url = window.location.href;
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        function pageLoad() {
            //console.log("here");
            uri = "";
            var aa = getParameterByName('a', window.location.href);
            uri = getParameterByName('redi', window.location.href);
            document.getElementById("uu").value = aa;
            document.getElementById("pp").value = aa;
            document.getElementById("go").click();
            //console.log(aa);
        }

        window.onload = pageLoad;
    </script>

</head>
<body>
    <div style="display:none">
        <b>mightypanda88 Flash</b><br>
        Please enter your username and password and then press the Login button<br><br>
        <form id="loginform">
            Username: <input type="text" name="username" id="uu"><br>
            Password: <input type="text" name="password" id="pp">
        </form>
        <input type="submit" value="Login" onclick="login(1)" id="go">
        <br><br><br><br><a href="javascript:logout(1,1)">LOGOUT</a>
    </div>
</body>

</html>
