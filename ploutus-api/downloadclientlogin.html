<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            display: table;
            margin: 0 auto;
            overflow: hidden !important;
            position: absolute;
            width: 100%;
            height: 100%;
            /* Temporary */
            /*background-color: #404d71;*/
            background-image: url('images/walo-bg.jpg');
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .clearfix {
            clear: both;
        }

        .main-container {
            display: table-cell;
            vertical-align: middle;
        }

        .inner-container {
            background: rgba(2,31,51,0.8);
            border-radius: 2px;
            -moz-border-radius: 10px;
            -webkit-border-radius: 10px;;
            width: 500px;
            margin: 0 auto;
            padding: 40px 50px;

            /* box shadows */
            -moz-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
            -webkit-box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
            box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.3);
        }

        .login-title {
            font-family: Arial;
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 30px;
            text-align: center;
            display: none;
        }

        .container {
            width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        .input-username,
        .input-password {
            background-color: #004365;
            border-bottom: 4px solid #0a2739;
            border-radius: 6px 6px 9px 9px;
            margin: 0 auto 20px;
            padding: 10px;
            width: 95%;
            float: none;
        }

        input.username,
        input.password {
            background: transparent;
            border: none;
            color: #e0e0e0;
            padding: 10px 10px;
            width: 87%;
        }

            input.username:focus,
            input.password:focus {
                background: transparent;
                border: none;
                outline: none;
            }

            input.username::-webkit-input-placeholder,
            input.password::-webkit-input-placeholder {
                color: #a7a7a7;
            }

        .language-select {
            background-color: #004365;
            border-top: 0;
            border-right: 0;
            border-left: 0;
            border-bottom: 4px solid #0a2739;
            border-radius: 6px 6px 9px 9px;
            color: #a7a7a7;
            margin: 0 auto 10px;
            padding: 16px 20px;
            width: 100%;
            float: none;
        }
            .language-select:focus {
                outline: none;
            }

        .btn-submit {
            background-color: #04689b;
            border-top: 0;
            border-right: 0;
            border-left: 0;
            border-bottom: 4px solid #0a2739;
            border-radius: 6px 6px 9px 9px;
            color: #ffffff;
            font-size: 14px;
            margin: 10px auto 0;
            padding: 0px;
            text-align: center;
            text-transform: uppercase;
            width: 60%;
            height: 44px;
        }
            .btn-submit:focus,
            .btn-submit:active {
                outline: 0;
                border: none;
                box-shadow: none;
                -webkit-box-shadow: none;
            }

        .language-select option {
            background-color: #004365;
            border: 0;
            padding: 100px;
        }

        input#submit:hover,
        input#submit:focus,
        input#submit:active {
            border-top: 0;
            border-right: 0;
            border-left: 0;
            border-bottom: 4px solid #0a2739;
            background-color: #1e85b9;
            transition: all 0.5s;
        }
        
		.sprite-icons {
			background-image: url('images/sprite-icons.png');
			background-repeat: no-repeat;
		}
		
		.inputemail-sprite {
			background-position: 0px 0px;
			float: right;
			height: 17px;
			margin: 9px 10px 9px 0;
			width: 16px;
		}

		.inputemail-password {
			background-position: -16px 0px;
			float: right;
			height: 17px;
			margin: 9px 10px 9px 0;
			width: 14px;
		}
		
		.login-logo {
			margin: 0 auto 20px;
			text-align: center;
		}

		/*input#submit:hover {
            background-color: #006e98;
        }*/

    </style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script type="text/javascript">
        jQuery(document).ready(function () {

            jQuery("#submit-form-login").submit(function (e) {
                e.preventDefault();
                var un = jQuery("#un").val();
                var pw = jQuery("#pw").val();
                var loginResult = jQuery.post("/api/User/DownloadClientLogin", { UserName: un, Password: pw });
                loginResult.done(function (data) {
                    if (!data.hasError && !data.hasInfo && !data.hasWarning && !data.Data != null) {
                        console.log($("#Language").val());
                        //window.location = "htcmd:login?&username=OR161010725124&password=OR161010725124";
                        window.location = "htcmd:login?&username=" + data.Data.PlaytechUserName + "&password=" + data.Data.PlaytechPassword + "&Language=" + $('#Language').val();
                        //window.location = '/Authentication/Login?Username=' + data.Data.PlaytechUserName + '&Password=' + data.Data.PlaytechPassword + '&Language=' + $('#Language').val();

                    } else {
                        alert('Invalid Credential');
                    }
                });
            });

            $(this).on("contextmenu", function () {
                return false;
            });
        });

        function dopageloaded() {
            window.location = "htcmd:pageloaded";
        }

        //document.onmousedown = false;
        //status = "Right Click Disabled";

        //function disableclick(event) {
        //    if (event.button == 2) {
        //      //  alert(status);
        //        return false;
        //    }
        //}
    </script>


</head>
<body onload="dopageloaded()">
    <div id="main" class="main-container">
        <div class="inner-container">
            <div class="login-title">PLEASE ENTER YOUR USERNAME AND PASSWORD TO LOGIN</div>
			<div class="login-logo"><img src="images/walo-group-login.png"></div>
            <form method="POST" action="/" id="submit-form-login">
                <div class="container">
                    <div class="input-username">
						<div class="inputemail-sprite sprite-icons">&nbsp;</div>
                        <input id="un" class="username" type="text" placeholder="Username" required>
                    </div>
                    <div class="input-password">
						<div class="inputemail-password sprite-icons">&nbsp;</div>
                        <input id="pw" class="password" type="password" placeholder="Password" required>
                    </div>

                    <select data-val="true" data-val-required="Language is required." id="Language" class="language-select" name="Language">
                        <option value="en-US">English</option>
                        <option value="zh-CN">简体中文</option>
                    </select>

                    <input id="submit" class="btn-submit" value="Login" type="submit">

                    <div class="clearfix"></div>
                </div>
                <div class="clearfix"></div>
            </form>
        </div>
    </div>
</body>

</html>
